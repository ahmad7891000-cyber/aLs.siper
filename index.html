<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>aLsband</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { 
            background: #080710; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #080710 70%);
        }
        
        /* الهيدر */
        .header { 
            text-align: center; 
            padding: 20px; 
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .header h1 { 
            font-size: 26px; 
            font-weight: 900;
            color: #00ffcc; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5), 0 0 20px rgba(0, 255, 204, 0.3);
            margin-bottom: 5px;
        }
        .header p { 
            font-size: 12px; 
            color: #a0a0b0; 
            letter-spacing: 1px;
        }

        /* لوحة التحكم */
        .controls { 
            padding: 20px; 
            z-index: 10;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .input-wrapper {
            position: relative;
            flex: 1;
        }
        
        .input-wrapper input { 
            width: 100%;
            padding: 15px 15px 15px 40px; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.05); 
            color: #fff; 
            font-size: 14px; 
            outline: none;
            transition: 0.3s;
            font-family: 'Cairo', sans-serif;
        }
        
        .input-wrapper input:focus { 
            border-color: #00ffcc; 
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            background: rgba(255,255,255,0.1);
        }
        
        .input-wrapper input::placeholder { color: #666; }
        
        /* الأزرار */
        .actions { 
            display: flex; 
            gap: 10px; 
        }
        
        .btn { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 16px; 
            cursor: pointer; 
            transition: all 0.3s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 8px;
            font-family: 'Cairo', sans-serif;
        }
        
        .btn-start { 
            background: linear-gradient(45deg, #ff0055, #ff4400); 
            color: white; 
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }
        
        .btn-start:active { transform: scale(0.97); box-shadow: 0 2px 5px rgba(255, 0, 85, 0.4); }
        
        .btn-stop { 
            background: rgba(255,255,255,0.1); 
            color: #ccc; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* شريط الحالة */
        .status-container {
            margin-top: 15px;
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 204, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 204, 0); }
        }

        .status-text { 
            font-size: 13px; 
            color: #00ffcc; 
            font-weight: 700;
        }

        /* المتصفح */
        .browser-container { 
            flex: 1; 
            position: relative; 
            background-color: #fff; 
            margin: 0 15px 15px 15px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* إذا رفض إنستغرام يفتح، نفتحه بنافذة خارجية */
        iframe { width: 100%; height: 100%; border: none; }
        
        #loader { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background:#080710; display:flex; flex-direction:column; 
            justify-content:center; align-items:center; z-index:999; 
        }
        .spinner { 
            width: 60px; height: 60px; 
            border: 4px solid rgba(0, 255, 204, 0.1); 
            border-top-color: #00ffcc; 
            border-radius: 50%; 
            animation: spin 1s linear infinite; 
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color: #00ffcc; font-size: 20px; font-weight: 900; letter-spacing: 2px;">aLSband</h2>
    </div>

    <div class="header">
        <h1>aLSband</h1>
        <p>نظام القنص الذكي</p>
    </div>

    <div class="controls">
        <div class="input-group">
            <div class="input-wrapper" style="flex: 2;">
                <input type="text" id="targetUser" placeholder="اسم حساب الهدف (بدون @)">
            </div>
            <div class="input-wrapper" style="flex: 1;">
                <input type="number" id="reportCount" value="10">
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-start" onclick="startSniper()">🎯 بدء القنص</button>
            <button class="btn btn-stop" onclick="stopSniper()">إيقاف</button>
        </div>
        
        <div class="status-container">
            <div class="status-dot"></div>
            <div class="status-text" id="statusText">تسجيل الدخول مطلوب من المتصفح</div>
        </div>
    </div>

    <div class="browser-container">
        <!-- المتصفح سيفتح نافذة خارجية إذا رفض إنستغرام -->
        <iframe id="instaBrowser" src="https://www.instagram.com/" allow="camera; microphone; autoplay; encrypted-media;"></iframe>
    </div>

    <script>
        let isRunning = false;
        let stopFlag = false;

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
            }, 1500);
        };

        function updateStatus(text) {
            document.getElementById('statusText').innerText = text;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function startSniper() {
            if (isRunning) return alert("هناك عملية قنص قيد التشغيل بالفعل!");
            
            const target = document.getElementById('targetUser').value.trim().replace('@', '');
            const count = parseInt(document.getElementById('reportCount').value) || 10;

            if (!target) return alert("الرجاء كتابة يوزر الهدف!");

            isRunning = true;
            stopFlag = false;
            
            // بما إن إنستغرام يرفض الاتصال داخل التطبيقات، راح نفتحه بالمتصفح الخارجي
            // لكن الكود هذا راح يحاول يشغل الأوامر إذا كان المتصفح يدعمها
            const iframe = document.getElementById('instaBrowser');

            updateStatus(`⏳ جاري فتح حساب @${target}...`);
            iframe.src = `https://www.instagram.com/${target}/`;
            
            await sleep(4000);

            updateStatus(`🎯 بدء القنص (${count} بلاغ)...`);

            for (let i = 1; i <= count; i++) {
                if (stopFlag) break;

                updateStatus(`💥 إرسال البلاغ ${i} من ${count}...`);

                try {
                    const doc = iframe.contentWindow.document;
                    
                    let optionsBtn = doc.querySelector('svg[aria-label="Options"]');
                    if (optionsBtn) {
                        optionsBtn.closest('button').click();
                        updateStatus(`تم فتح القائمة...`);
                        
                        await sleep(1500);

                        let buttons = Array.from(doc.querySelectorAll('button, div[role="button"]'));
                        let reportBtn = buttons.find(b => b.innerText === 'Report' || b.innerText.includes('Report'));
                        
                        if (reportBtn) {
                            reportBtn.click();
                            updateStatus(`تم اختيار البلاغ...`);
                            await sleep(1500);

                            let spamBtn = Array.from(doc.querySelectorAll('button, div[role="button"]')).find(b => b.innerText.includes('Spam') || b.innerText.includes('Something about'));
                            if (spamBtn) {
                                spamBtn.click();
                                await sleep(1000);
                                
                                let submitBtn = Array.from(doc.querySelectorAll('button, div[role="button"]')).find(b => b.innerText === 'Submit' || b.innerText === 'Done');
                                if (submitBtn) {
                                    submitBtn.click();
                                    updateStatus(`✅ تم إرسال البلاغ ${i}`);
                                }
                            }
                        }
                    } else {
                        updateStatus(`❌ الحماية تمنع التحكم الآلي.`);
                    }
                } catch (e) {
                    updateStatus(`❌ الحماية تمنع التحكم الآلي.`);
                }

                for (let sec = 20; sec > 0; sec--) {
                    if (stopFlag) break;
                    updateStatus(`⏳ انتظار (${sec}ث) قبل البلاغ التالي...`);
                    await sleep(1000);
                }
            }

            isRunning = false;
            updateStatus(`✅ انتهت العملية.`);
        }

        function stopSniper() {
            stopFlag = true;
            isRunning = false;
            updateStatus(`🛑 تم إيقاف القنص.`);
        }
    </script>
</body>
</html>
